<div class="payment-method fintoc" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()"/>
        <label data-bind="attr: {'for': getCode()}" class="label">
            <span style="display: inline-flex; flex-direction: column; vertical-align: middle;">
                <span data-bind="html: getTitle()"></span>
                <span data-bind="text: getSubtitle()" style="font-size: 12px; color: #6d6d6d;"></span>
            </span>
            <!-- ko if: getComboLogo() -->
            <img data-bind="attr: {src: getComboLogo()}" alt="Fintoc" style="vertical-align: middle; margin-left: 8px;"/>
            <!-- /ko -->
            <!-- ko ifnot: getComboLogo() -->
            <span style="display: inline-flex; align-items: center; gap: 8px; vertical-align: middle; margin-left: 8px;">
                <span style="display: inline-flex; flex-direction: column; align-items: center; gap: 4px;">
                    <!-- ko foreach: getLogoRows() -->
                    <span style="display: flex; gap: 4px;">
                        <!-- ko foreach: $data -->
                        <img data-bind="attr: {src: $data}" alt="" style="height: 28px; width: auto; display: block;"/>
                        <!-- /ko -->
                    </span>
                    <!-- /ko -->
                </span>
                <!-- ko if: getBrandLogo() -->
                <img data-bind="attr: {src: getBrandLogo()}" alt="Fintoc" style="height: 51px; width: auto;"/>
                <!-- /ko -->
            </span>
            <!-- /ko -->
        </label>
    </div>
    <div class="payment-method-content">
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->
        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout"
                        type="submit"
                        data-bind="
                        click: placeOrder,
                        attr: {title: $t('Place Order')},
                        css: {disabled: !isPlaceOrderActionAllowed()},
                        enable: (getCode() == isChecked())
                        "
                        disabled>
                    <span data-bind="i18n: 'Place Order'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
